name: codeql-javac

on: push

jobs:
  codeql:
    name: codeql javac
    strategy:
      matrix:
        include:
          - language: java

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Send java files to javac
        run: find . -name "*.java" | sed 's| |\\ |g' | xargs javac -encoding US-ASCII || true
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        id: analyze

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: CodeQL-Java
          path: ${{ steps.analyze.outputs.db-locations.jav }}
